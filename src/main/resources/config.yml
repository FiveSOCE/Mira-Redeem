security:
  # Generated automatically on first startup. Do not share or edit after vouchers have been issued.
  signing-secret: ""

messages:
  invalid-item: "&cThis redeem item is invalid or has been modified."
  command-failed: "&cRedeem failed. Your item was not consumed. Please contact staff."
  no-permission: "&cYou do not have permission to use this command."
  unknown-redeem: "&cUnknown redeem id: &f%redeem%"
  player-not-found: "&cPlayer not found: &f%player%"
  given: "&aGave &f%amount%x &a%redeem% &ato &f%player%&a."
  reloaded: "&aMiraRedeem reloaded."
  rank-unavailable: "&cRank vouchers are temporarily unavailable because LuckPerms is not loaded. Your voucher was not consumed."
  rank-track-missing: "&cRank voucher configuration error: track &f%track% &cdoes not exist. Your voucher was not consumed."
  rank-target-missing: "&cRank voucher configuration error: &f%rank% &cis not on track &f%track%&c. Your voucher was not consumed."
  rank-user-unavailable: "&cYour LuckPerms profile is not currently available. Your voucher was not consumed."
  rank-ambiguous: "&cYour rank data has multiple groups on the &f%track% &ctrack. Please contact staff. Your voucher was not consumed."
  rank-same: "&eYou already have the &f%rank% &erank. This voucher was not consumed."
  rank-lower: "&cYou already have a higher rank (&f%current%&c) than &f%rank%&c. This voucher was not consumed."

redeems:
  pyro_axe:
    material: PAPER
    name: "&6&lPyro Axe Voucher"
    lore:
      - "&7Right-click to redeem."
      - "&7Grants: &6Pyro Axe"
      - ""
      - "&cThis item cannot be modified."
    commands:
      - "mitem give %player% pyro_axe"
    success-message: "&aYou redeemed a &6Pyro Axe&a!"


