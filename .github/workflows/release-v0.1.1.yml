name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            build/libs/MiraRedeem-0.1.1.jar \
            --target "${GITHUB_SHA}" \
            --title "MiraRedeem v0.1.1" \
            --notes "Adds reliable right-click-air redemption while preserving right-click-block redemption, voucher validation, console command execution, feedback, and exact one-item consumption."
